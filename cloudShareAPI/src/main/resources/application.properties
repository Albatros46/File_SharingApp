spring.application.name=cloudShareAPI
server.port=8080

# MongoDB (local)
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/cloudshare}
spring.data.mongodb.auto-index-creation=true

# Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# App
app.upload-dir=${UPLOAD_DIR:uploads}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.signup-credits=5
app.credits-per-upload=1

# JWT - change the secret in production (min 32 chars)
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-1234567890}
app.jwt.expiration-ms=86400000

# Stripe - leave blank to use demo payment mode (credits are added without a real payment)
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.currency=usd
